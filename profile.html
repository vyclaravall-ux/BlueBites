<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Bites — Profile</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // Check authentication before page loads
    (function() {
      const SESSION_KEY = 'bb_session_user';
      try {
        const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        if (!session) {
          const next = encodeURIComponent('profile.html');
          window.location.href = 'login.html?next=' + next;
        }
      } catch (e) {
        const next = encodeURIComponent('profile.html');
        window.location.href = 'login.html?next=' + next;
      }
    })();
  </script>
</head>
<body>
  <a id="top"></a>
  <div class="wrapper">
    <header class="header">
      <div class="brand"><img class="logo-img" src="./assets/eagle logo.png" alt="Blue Bites" /><span>Blue Bites</span></div>
      <nav class="nav">
        <a href="map.html">Map</a>
        <a href="shop.html#filtersTop">Filter Menu</a>
        <a href="budget.html">Budget Tracker</a>
        <a class="btn" href="profile.html">Profile</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <section class="section">
      <div style="display:flex; align-items:center; gap:18px;">
        <div>
          <h1 class="h1" id="profileName">Username</h1>
          <div class="subtle" id="profileEmail">ateneoemailaccount@student.ateneo.edu</div>
        </div>
        <div style="margin-left:auto;">
          <button id="logoutBtn" class="fav-btn">Log out</button>
        </div>
      </div>

      <div class="profile-grid">
        <div class="profile-section">
          <h3 class="mt-28">Favorites ☆</h3>
          <div class="card mt-28" style="padding:16px;">
            <strong>Favorite Meals</strong>
            <ul id="favMeals" style="margin-top:10px"></ul>
          </div>
        </div>

        <div class="profile-section">
          <div class="section-header">
            <h3 class="mt-28">Friends</h3>
            <button id="addFriendBtn" class="btn btn-sm" style="margin-left: auto;">+ Add Friend</button>
          </div>
          <div class="card mt-28" style="padding:16px;">
            <div id="friendsList" class="friends-list">
              <!-- Friends will be added here by JavaScript -->
              <div class="empty-state">No friends yet. Add some friends to see them here!</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mt-28" style="padding:16px;">
        <strong>Favorite Food Stalls</strong>
        <div class="cards mt-28">
          <div class="card-item"><div style="height:120px;background:#e5e7eb;border-radius:10px"></div></div>
          <div class="card-item"><div style="height:120px;background:#e5e7eb;border-radius:10px"></div></div>
          <div class="card-item"><div style="height:120px;background:#e5e7eb;border-radius:10px"></div></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="brand"><img class="logo-img" src="./assets/eagle logo.png" alt="Blue Bites" /><span>Blue Bites</span></div>
      <div class="actions">
        <a class="action-btn action-primary" href="index.html">Home</a>
        <a class="action-btn action-secondary" href="#top">Back to Top</a>
      </div>
    </footer>
  </div>
  <script src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Bite — Map</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <a id="top"></a>
  <div class="wrapper">
    <header class="header">
      <div class="brand"><a href="index.html" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;"><img class="logo-img" src="./assets/eagle.svg" alt="Blue Bites" /><span>Blue Bites</span></a></div>
      <nav class="nav">
        <a href="map.html">Map</a>
        <a href="shop.html#filtersTop">Filter Menu</a>
        <a href="budget.html">Budget Tracker</a>
        <a class="btn" href="profile.html">Profile</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <section class="section">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h1 class="h1">Food Stalls Map</h1>
        <button id="exportStallsCsv" class="action-btn small action-secondary">Export Stalls CSV</button>
      </div>
      <p class="filter">Filter</p>
      <div class="chips" id="areaChips">
        <button class="chip active" data-area="all">All</button>
        <button class="chip" data-area="Gonzaga">Gonzaga</button>
        <button class="chip" data-area="JSEC">JSEC</button>
        <button class="chip" data-area="ISO">ISO</button>
        <button class="chip" data-area="New Rizal Library">New Rizal Library</button>
      </div>
      <div id="map" style="width:100%; height: 360px; border-radius:12px;"></div>
      <div id="stallsLists" class="mt-28"></div>
      <div id="stallsStatus" class="muted" style="margin-top:10px">Loading stalls…</div>
    </section>

    <footer class="footer">
      <div class="brand"><a href="index.html" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;"><img class="logo-img" src="./assets/eagle.svg" alt="Blue Bites" /><span>Blue Bites</span></a></div>
      <div class="actions">
        <a class="action-btn action-primary" href="index.html">Home</a>
        <a class="action-btn action-secondary" href="#top">Back to Top</a>
      </div>
    </footer>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./script.js"></script>
</body>
</html>

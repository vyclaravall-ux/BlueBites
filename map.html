<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Bite — Map</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a id="top"></a>
  <div class="wrapper">
    <header class="header">
      <div class="brand"><a href="index.html" style="display:flex;align-items:center;gap:4px;text-decoration:none;color:inherit;"><img class="logo-img" src="./assets/eagle logo.png" alt="Blue Bites" /><span>Blue Bites</span></a></div>
      <nav class="nav">
        <a href="map.html">Map</a>
        <a href="shop.html#filtersTop">Filter Menu</a>
        <a href="budget.html">Budget Tracker</a>
        <a class="btn" href="profile.html">Profile</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <section class="section">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h1 class="h1">Food Stalls Map</h1>
        <button id="exportStallsCsv" class="action-btn small action-secondary">Export Stalls CSV</button>
      </div>
      <p class="filter">Filter</p>
      <div class="chips" id="areaChips">
        <button class="chip active" data-area="all">All</button>
        <button class="chip" data-area="Gonzaga">Gonzaga</button>
        <button class="chip" data-area="JSEC">JSEC</button>
        <button class="chip" data-area="ISO">ISO</button>
        <button class="chip" data-area="New Rizal Library">New Rizal Library</button>
      </div>
      <div class="map-container">
        <div class="map-search">
          <input type="text" id="searchBox" placeholder="Search for food stalls..." />
          <button id="locateMe" title="Locate Me">📍</button>
        </div>
        <div id="map" style="width:100%; height: 500px; border-radius:12px;"></div>
        <div class="map-legend">
          <div><span class="legend-icon" style="background-color: #e74c3c;"></span> Food Stalls</div>
          <div><span class="legend-icon" style="background-color: #3498db;"></span> Popular Spots</div>
          <div><span class="legend-icon" style="background-color: #2ecc71;"></span> Special Diets</div>
        </div>
      </div>
      <div id="stallsLists" class="mt-28"></div>
      <div id="stallsStatus" class="muted" style="margin-top:10px">Loading stalls…</div>
    </section>

    <footer class="footer">
      <div class="brand"><a href="index.html" style="display:flex;align-items:center;gap:4px;text-decoration:none;color:inherit;"><img class="logo-img" src="./assets/eagle logo.png" alt="Blue Bites" /><span>Blue Bites</span></a></div>
      <div class="actions">
        <a class="action-btn action-primary" href="index.html">Home</a>
        <a class="action-btn action-secondary" href="#top">Back to Top</a>
      </div>
    </footer>
  </div>
  <script src="./script.js"></script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBFw0Qbyq9zTFTd-tUY6dZWTgaQzuU17R8&callback=initGoogleMap"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Bites — Budget Tracker</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a id="top"></a>
  <div class="wrapper">
    <header class="header">
      <div class="brand"><a href="index.html" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;"><img class="logo-img" src="./assets/eagle.svg" alt="Blue Bites" /><span>Blue Bites</span></a></div>
      <nav class="nav">
        <a href="map.html">Map</a>
        <a href="shop.html#filtersTop">Filter Menu</a>
        <a href="budget.html">Budget Tracker</a>
        <a class="btn" href="profile.html">Profile</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <section class="section" style="max-width:900px;margin:0 auto;">
      <h1 class="h1">Budget Tracker</h1>
      <p class="subtle">Keep it simple: set a budget and log your expenses. Saved to your profile.</p>

      <div class="two-col mt-28">
        <div class="card" style="padding:16px;">
          <h3>Budget Setup</h3>
          <form id="budgetSetup" class="form">
            <div class="row">
              <div>
                <div class="label">Budget Amount (₱)</div>
                <input id="amount" class="input" type="number" min="0" step="1" placeholder="1000" />
              </div>
              <div>
                <div class="label">Period (days)</div>
                <input id="periodDays" class="input" type="number" min="1" step="1" placeholder="7" />
              </div>
            </div>
            <button class="submit" type="submit">Save / Reset Period</button>
          </form>

          <div id="budgetSummary" class="mt-28"></div>
        </div>

        <div class="card" style="padding:16px;">
          <h3>Add Expense</h3>
          <form id="expenseForm" class="form">
            <div class="row">
              <div>
                <div class="label">What</div>
                <input id="expNote" class="input" type="text" placeholder="Meal / Snack / Drink" />
              </div>
              <div>
                <div class="label">Amount (₱)</div>
                <input id="expAmount" class="input" type="number" min="1" step="1" placeholder="100" required />
              </div>
            </div>
            <div>
              <div class="label">Date</div>
              <input id="expDate" class="input" type="date" />
            </div>
            <button class="submit" type="submit">Add Expense</button>
          </form>
        </div>
      </div>

      <div class="card mt-28" style="padding:16px;">
        <h3>Expenses</h3>
        <ul id="expensesList"></ul>
      </div>
    </section>

    <footer class="footer">
      <div class="brand"><img class="logo-img" src="./assets/eagle.svg" alt="Blue Bites" /><span>Blue Bites</span></div>
      <div class="actions">
        <a class="action-btn action-primary" href="index.html">Home</a>
        <a class="action-btn action-secondary" href="#top">Back to Top</a>
      </div>
    </footer>
  </div>
  <script src="./script.js"></script>
</body>
</html>
